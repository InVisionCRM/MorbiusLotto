# Railway config-as-code for the Blackjack server
# https://docs.railway.com/guides/config-as-code
# In Railway: set Service "Root Directory" to `server` and "Config File" to `server/railway.toml`

[build]
builder = "railpack"
buildCommand = "npm install --ignore-scripts && (cd node_modules/@chevtek/poker-engine && node ../../typescript/bin/tsc --project tsconfig.json || true) && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
