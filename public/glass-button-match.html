<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass button — matched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter,system-ui,sans-serif;
    background:
      linear-gradient(125deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 24%),
      linear-gradient(300deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 30%),
      radial-gradient(135% 135% at 20% 2%, #eff0f2 0%, #e4e5e9 55%, #d9dade 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:60px 24px;overflow:hidden}
  body::before{content:"";position:fixed;inset:-25%;pointer-events:none;
    background:
      linear-gradient(122deg, transparent 32%, rgba(255,255,255,.55) 43%, transparent 51%),
      linear-gradient(122deg, transparent 62%, rgba(255,255,255,.4) 71%, transparent 79%);
    filter:blur(10px)}

  .row{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}

  .glass{position:relative;cursor:pointer;border:none;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:.5em;white-space:nowrap;
    font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.015em;
    background:linear-gradient(177deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.30) 46%, rgba(255,255,255,.40) 100%);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);
    box-shadow:
      inset 0 1.4px 0.4px rgba(255,255,255,.98),
      inset 0 -1.6px 1.2px rgba(120,124,135,.20),
      inset 1.2px 0 1px rgba(255,255,255,.55),
      inset -1.2px 0 1px rgba(255,255,255,.35),
      0 0 0 1px rgba(255,255,255,.6),
      0 0 0 1.6px rgba(172,176,188,.32),
      0 26px 50px -16px rgba(38,46,64,.24),
      0 6px 14px -5px rgba(38,46,64,.16);
    transition:transform .12s cubic-bezier(.4,.9,.3,1.25), filter .15s ease, box-shadow .15s ease}
  /* diagonal top sheen */
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
    background:linear-gradient(118deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.18) 24%, rgba(255,255,255,0) 42%);
    mix-blend-mode:screen}
  /* lower soft glow */
  .glass::after{content:"";position:absolute;left:6%;right:6%;bottom:2px;height:44%;border-radius:999px;pointer-events:none;z-index:0;
    background:radial-gradient(120% 100% at 50% 100%, rgba(255,255,255,.38), transparent 72%)}
  .glass .inner{position:relative;z-index:1;display:flex;align-items:center;gap:.5em}
  .glass:hover{transform:translateY(-2px);
    box-shadow:
      inset 0 1.4px 0.4px rgba(255,255,255,.98), inset 0 -1.6px 1.2px rgba(120,124,135,.20),
      0 0 0 1px rgba(255,255,255,.65), 0 0 0 1.6px rgba(172,176,188,.32),
      0 34px 60px -16px rgba(38,46,64,.28), 0 8px 18px -5px rgba(38,46,64,.18)}
  .glass:active{transform:translateY(1px) scale(.994)}

  .sm{padding:15px 32px;font-size:25px}
  .sm .spark{width:21px;height:21px}
  .lg{padding:38px 92px;font-size:62px;font-weight:900}
  .lg .spark{width:50px;height:50px}

  /* text finishes apply to the inner span only, so the frosted glass body stays intact */
  .t-frost .inner{color:rgba(255,255,255,.9);
    text-shadow:0 1px 1px rgba(255,255,255,.95), 0 -1px 1px rgba(110,114,130,.5), 0 0 14px rgba(255,255,255,.4)}
  .t-frost .spark path{fill:rgba(255,255,255,.95)}
  .t-gold .inner{background:linear-gradient(180deg,#f4dfa8 0%,#d0a94f 46%,#916b28 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .t-gold .spark path{fill:#c69544}
  .t-blue .inner{background:linear-gradient(180deg,#9fb6d2 0%,#4f70a0 46%,#2c4570 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .t-blue .spark path{fill:#4f70a0}
  .t-dark .inner{color:#222c3a}
  .t-dark .spark path{fill:#222c3a}

  .cap{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#9a9ea8;font-size:12px;font-weight:500;z-index:3}
</style>
<div class="row">
  <button class="glass sm t-frost"><span class="inner"><svg class="spark" viewBox="0 0 24 24"><path d="M14 2l1.4 4.1L19.5 7.5l-4.1 1.4L14 13l-1.4-4.1L8.5 7.5l4.1-1.4zM6 12l.9 2.6 2.6.9-2.6.9L6 19l-.9-2.6L2.5 15.5l2.6-.9z"/></svg>Generate</span></button>
  <button class="glass sm t-gold"><span class="inner"><svg class="spark" viewBox="0 0 24 24"><path d="M14 2l1.4 4.1L19.5 7.5l-4.1 1.4L14 13l-1.4-4.1L8.5 7.5l4.1-1.4zM6 12l.9 2.6 2.6.9-2.6.9L6 19l-.9-2.6L2.5 15.5l2.6-.9z"/></svg>Generate</span></button>
  <button class="glass sm t-blue"><span class="inner"><svg class="spark" viewBox="0 0 24 24"><path d="M14 2l1.4 4.1L19.5 7.5l-4.1 1.4L14 13l-1.4-4.1L8.5 7.5l4.1-1.4zM6 12l.9 2.6 2.6.9-2.6.9L6 19l-.9-2.6L2.5 15.5l2.6-.9z"/></svg>Generate</span></button>
</div>
<div class="row">
  <button class="glass lg t-dark"><span class="inner"><svg class="spark" viewBox="0 0 24 24"><path d="M14 2l1.4 4.1L19.5 7.5l-4.1 1.4L14 13l-1.4-4.1L8.5 7.5l4.1-1.4zM6 12l.9 2.6 2.6.9-2.6.9L6 19l-.9-2.6L2.5 15.5l2.6-.9z"/></svg>Generate</span></button>
</div>
<div class="cap">Reproduced from your Figma reference — frosted glass pill, four text finishes</div>
